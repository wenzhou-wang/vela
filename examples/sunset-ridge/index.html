<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vela · sunset ridge</title>
    <style>
      :root { color-scheme: dark; --accent: #ffbd6c; --muted: #aeb3c0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #090b13; }
      body { color: #f4f0e8; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .panel { position: fixed; left: 18px; padding: 15px 17px; border: 1px solid #ffffff18;
        border-radius: 14px; background: #10131dcc; backdrop-filter: blur(14px); }
      #info { top: 18px; max-width: 355px; }
      #controls { bottom: 18px; display: grid; gap: 9px; min-width: 260px; }
      h1 { margin: 0 0 5px; font-size: 18px; letter-spacing: .02em; }
      p { margin: 0; color: var(--muted); }
      .features { margin-top: 10px; color: var(--accent); font: 11px/1.6 ui-monospace, monospace; }
      label { display: grid; grid-template-columns: 1fr 130px; align-items: center; gap: 12px; }
      label span { color: var(--muted); }
      input { width: 100%; accent-color: var(--accent); }
      #unsupported { display: none; position: fixed; inset: 0; place-items: center; padding: 30px; text-align: center; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <section id="info" class="panel">
      <h1>Sunset Ridge</h1>
      <p>A procedural landscape with no downloaded assets. Fly from the lake to the peaks and watch each terrain tile choose its own detail level.</p>
      <div class="features">TERRAIN LOD · CUSTOM PBR · CASCADED SHADOWS<br>VOLUMETRIC FOG · TAA · BLOOM</div>
    </section>
    <section id="controls" class="panel">
      <label><span>Sun height</span><input id="sun" type="range" min="0.08" max="0.8" step="0.01" value="0.24" /></label>
      <label><span>Fog density</span><input id="fog" type="range" min="0" max="0.025" step="0.001" value="0.009" /></label>
      <label><span>Auto orbit</span><input id="orbit" type="checkbox" checked /></label>
    </section>
    <div id="unsupported"><div><h2>WebGPU is required</h2><p>Open this demo in a WebGPU-capable browser.</p></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
